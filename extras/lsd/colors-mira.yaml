# Flume colors for lsd.
# lsd color themes only style metadata; file names continue to use LS_COLORS.
# Quoted hex colors preserve the selected palette through lsd's crossterm parser.

user: "#cac7d3"              # syntax_primary (#cac7d3)
group: "#d99eaa"             # syntax_property (#d99eaa)

permission:
  read: "#acabb9"             # quiet metadata (#acabb9)
  write: "#ddc59b"            # quiet metadata (#ddc59b)
  exec: "#b9cba5"             # quiet metadata (#b9cba5)
  exec-sticky: "#ee9da7"      # error (#ee9da7)
  no-access: "#acabb9"        # muted (#acabb9)
  octal: "#acabb9"            # muted (#acabb9)
  acl: "#98c4d0"              # accent (#98c4d0)
  context: "#979ba7"          # doc_comment (#979ba7)

date:
  hour-old: "#979ba7"         # syntax_doc_comment (#979ba7)
  day-old: "#979ba7"          # syntax_doc_comment (#979ba7)
  older: "#979ba7"            # syntax_doc_comment (#979ba7)

size:
  none: "#98c4d0"             # info (#98c4d0)
  small: "#98c4d0"            # info (#98c4d0)
  medium: "#98c4d0"           # info (#98c4d0)
  large: "#ddc59b"            # warning (#ddc59b)

inode:
  valid: "#6d7080"            # placeholder (#6d7080)
  invalid: "#ee9da7"          # error (#ee9da7)

links:
  valid: "#98c4d0"            # accent (#98c4d0)
  invalid: "#ee9da7"          # error (#ee9da7)

tree-edge: "#3a3b45"          # border_variant (#3a3b45)

git-status:
  default: "#acabb9"          # muted (#acabb9)
  unmodified: "#acabb9"       # muted (#acabb9)
  ignored: "#acabb9"          # muted (#acabb9)
  new-in-index: "#b9cba5"     # success (#b9cba5)
  new-in-workdir: "#b9cba5"   # success (#b9cba5)
  typechange: "#ddc59b"       # warning (#ddc59b)
  deleted: "#ee9da7"          # error (#ee9da7)
  renamed: "#98c4d0"          # accent (#98c4d0)
  modified: "#ddc59b"          # warning (#ddc59b)
  conflicted: "#ee9da7"        # error (#ee9da7)
