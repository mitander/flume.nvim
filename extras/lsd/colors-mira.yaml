# Flume colors for lsd.
# lsd color themes only style metadata; file names continue to use LS_COLORS.
# Quoted hex colors preserve the selected palette through lsd's crossterm parser.

user: "#bdc0c8"              # syntax_primary (#bdc0c8)
group: "#b495a7"             # syntax_property (#b495a7)

permission:
  read: "#a1a3ad"             # quiet metadata (#a1a3ad)
  write: "#bba17e"            # quiet metadata (#bba17e)
  exec: "#90aa9b"             # quiet metadata (#90aa9b)
  exec-sticky: "#cc91a5"      # error (#cc91a5)
  no-access: "#a1a3ad"        # muted (#a1a3ad)
  octal: "#a1a3ad"            # muted (#a1a3ad)
  acl: "#8caabd"              # accent (#8caabd)
  context: "#989ba5"          # doc_comment (#989ba5)

date:
  hour-old: "#989ba5"         # syntax_doc_comment (#989ba5)
  day-old: "#989ba5"          # syntax_doc_comment (#989ba5)
  older: "#989ba5"            # syntax_doc_comment (#989ba5)

size:
  none: "#8caabd"             # info (#8caabd)
  small: "#8caabd"            # info (#8caabd)
  medium: "#8caabd"           # info (#8caabd)
  large: "#c5b18d"            # warning (#c5b18d)

inode:
  valid: "#727580"            # placeholder (#727580)
  invalid: "#cc91a5"          # error (#cc91a5)

links:
  valid: "#8caabd"            # accent (#8caabd)
  invalid: "#cc91a5"          # error (#cc91a5)

tree-edge: "#363941"          # border_variant (#363941)

git-status:
  default: "#a1a3ad"          # muted (#a1a3ad)
  unmodified: "#a1a3ad"       # muted (#a1a3ad)
  ignored: "#a1a3ad"          # muted (#a1a3ad)
  new-in-index: "#95b0a2"     # success (#95b0a2)
  new-in-workdir: "#95b0a2"   # success (#95b0a2)
  typechange: "#c5b18d"       # warning (#c5b18d)
  deleted: "#cc91a5"          # error (#cc91a5)
  renamed: "#8caabd"          # accent (#8caabd)
  modified: "#c5b18d"          # warning (#c5b18d)
  conflicted: "#cc91a5"        # error (#cc91a5)
