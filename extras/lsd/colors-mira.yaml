# Flume colors for lsd.
# lsd color themes only style metadata; file names continue to use LS_COLORS.
# Quoted hex colors preserve the selected palette through lsd's crossterm parser.

user: "#d3cbd8"              # syntax_primary (#d3cbd8)
group: "#d6a5bd"             # syntax_property (#d6a5bd)

permission:
  read: "#a59aaa"             # quiet metadata (#a59aaa)
  write: "#ddc59b"            # quiet metadata (#ddc59b)
  exec: "#b9cba5"             # quiet metadata (#b9cba5)
  exec-sticky: "#e8a1b0"      # error (#e8a1b0)
  no-access: "#a59aaa"        # muted (#a59aaa)
  octal: "#a59aaa"            # muted (#a59aaa)
  acl: "#9bbec5"              # accent (#9bbec5)
  context: "#a59aaa"          # doc_comment (#a59aaa)

date:
  hour-old: "#a59aaa"         # syntax_doc_comment (#a59aaa)
  day-old: "#a59aaa"          # syntax_doc_comment (#a59aaa)
  older: "#a59aaa"            # syntax_doc_comment (#a59aaa)

size:
  none: "#9bbec5"             # info (#9bbec5)
  small: "#9bbec5"            # info (#9bbec5)
  medium: "#9bbec5"           # info (#9bbec5)
  large: "#dcc18f"            # warning (#dcc18f)

inode:
  valid: "#635e6c"            # placeholder (#635e6c)
  invalid: "#e8a1b0"          # error (#e8a1b0)

links:
  valid: "#9bbec5"            # accent (#9bbec5)
  invalid: "#e8a1b0"          # error (#e8a1b0)

tree-edge: "#393543"          # border_variant (#393543)

git-status:
  default: "#a59aaa"          # muted (#a59aaa)
  unmodified: "#a59aaa"       # muted (#a59aaa)
  ignored: "#a59aaa"          # muted (#a59aaa)
  new-in-index: "#b6c7ad"     # success (#b6c7ad)
  new-in-workdir: "#b6c7ad"   # success (#b6c7ad)
  typechange: "#dcc18f"       # warning (#dcc18f)
  deleted: "#e8a1b0"          # error (#e8a1b0)
  renamed: "#9bbec5"          # accent (#9bbec5)
  modified: "#dcc18f"          # warning (#dcc18f)
  conflicted: "#e8a1b0"        # error (#e8a1b0)
