# Flume colors for lsd.
# lsd color themes only style metadata; file names continue to use LS_COLORS.
# Quoted hex colors preserve the selected palette through lsd's crossterm parser.

user: "#cbcccf"              # syntax_primary (#cbcccf)
group: "#c699a2"             # syntax_property (#c699a2)

permission:
  read: "#a1a5b3"             # quiet metadata (#a1a5b3)
  write: "#ddc59b"            # quiet metadata (#ddc59b)
  exec: "#b9cba5"             # quiet metadata (#b9cba5)
  exec-sticky: "#ec929b"      # error (#ec929b)
  no-access: "#a1a5b3"        # muted (#a1a5b3)
  octal: "#a1a5b3"            # muted (#a1a5b3)
  acl: "#95bbc9"              # accent (#95bbc9)
  context: "#9fa3b0"          # doc_comment (#9fa3b0)

date:
  hour-old: "#9fa3b0"         # syntax_doc_comment (#9fa3b0)
  day-old: "#9fa3b0"          # syntax_doc_comment (#9fa3b0)
  older: "#9fa3b0"            # syntax_doc_comment (#9fa3b0)

size:
  none: "#95bbc9"             # info (#95bbc9)
  small: "#95bbc9"            # info (#95bbc9)
  medium: "#95bbc9"           # info (#95bbc9)
  large: "#e3bf70"            # warning (#e3bf70)

inode:
  valid: "#635e6c"            # placeholder (#635e6c)
  invalid: "#ec929b"          # error (#ec929b)

links:
  valid: "#95bbc9"            # accent (#95bbc9)
  invalid: "#ec929b"          # error (#ec929b)

tree-edge: "#3e4252"          # border_variant (#3e4252)

git-status:
  default: "#a1a5b3"          # muted (#a1a5b3)
  unmodified: "#a1a5b3"       # muted (#a1a5b3)
  ignored: "#a1a5b3"          # muted (#a1a5b3)
  new-in-index: "#9cbeac"     # success (#9cbeac)
  new-in-workdir: "#9cbeac"   # success (#9cbeac)
  typechange: "#e3bf70"       # warning (#e3bf70)
  deleted: "#ec929b"          # error (#ec929b)
  renamed: "#95bbc9"          # accent (#95bbc9)
  modified: "#e3bf70"          # warning (#e3bf70)
  conflicted: "#ec929b"        # error (#ec929b)
