# Flume colors for lsd.
# lsd color themes only style metadata; file names continue to use LS_COLORS.
# Quoted hex colors preserve the selected palette through lsd's crossterm parser.

user: "#514e57"              # syntax_primary (#514e57)
group: "#9d395e"             # syntax_property (#9d395e)

permission:
  read: "#615a68"             # quiet metadata (#615a68)
  write: "#615a68"            # quiet metadata (#615a68)
  exec: "#615a68"             # quiet metadata (#615a68)
  exec-sticky: "#9d395e"      # error (#9d395e)
  no-access: "#615a68"        # muted (#615a68)
  octal: "#615a68"            # muted (#615a68)
  acl: "#00667e"              # accent (#00667e)
  context: "#636064"          # doc_comment (#636064)

date:
  hour-old: "#636064"         # syntax_doc_comment (#636064)
  day-old: "#636064"          # syntax_doc_comment (#636064)
  older: "#636064"            # syntax_doc_comment (#636064)

size:
  none: "#00667e"             # info (#00667e)
  small: "#00667e"            # info (#00667e)
  medium: "#00667e"           # info (#00667e)
  large: "#7e5500"            # warning (#7e5500)

inode:
  valid: "#817987"            # placeholder (#817987)
  invalid: "#9d395e"          # error (#9d395e)

links:
  valid: "#00667e"            # accent (#00667e)
  invalid: "#9d395e"          # error (#9d395e)

tree-edge: "#c8c0ca"          # border_variant (#c8c0ca)

git-status:
  default: "#615a68"          # muted (#615a68)
  unmodified: "#615a68"       # muted (#615a68)
  ignored: "#615a68"          # muted (#615a68)
  new-in-index: "#246b23"     # success (#246b23)
  new-in-workdir: "#246b23"   # success (#246b23)
  typechange: "#7e5500"       # warning (#7e5500)
  deleted: "#9d395e"          # error (#9d395e)
  renamed: "#00667e"          # accent (#00667e)
  modified: "#7e5500"          # warning (#7e5500)
  conflicted: "#9d395e"        # error (#9d395e)
