size:
  none: 60             # placeholder (#67627d)
  small: 145            # muted (#a6a2bb)
  medium: 145           # muted (#a6a2bb)
  large: 179            # warning (#dfb86b)

inode:
  valid: 145            # muted (#a6a2bb)
