# Flume colors for lsd.
# lsd color themes only style metadata; file names continue to use LS_COLORS.
# Quoted hex colors preserve the selected palette through lsd's crossterm parser.

user: "#c9c5d9"              # syntax_primary (#c9c5d9)
group: "#ce818d"             # syntax_property (#ce818d)

permission:
  read: "#a6a2bb"             # quiet metadata (#a6a2bb)
  write: "#dfb86b"            # quiet metadata (#dfb86b)
  exec: "#a4b78a"             # quiet metadata (#a4b78a)
  exec-sticky: "#f08692"      # error (#f08692)
  no-access: "#a6a2bb"        # muted (#a6a2bb)
  octal: "#a6a2bb"            # muted (#a6a2bb)
  acl: "#7dacbb"              # accent (#7dacbb)
  context: "#9297a9"          # doc_comment (#9297a9)

date:
  hour-old: "#9297a9"         # syntax_doc_comment (#9297a9)
  day-old: "#9297a9"          # syntax_doc_comment (#9297a9)
  older: "#9297a9"            # syntax_doc_comment (#9297a9)

size:
  none: "#7dacbb"             # info (#7dacbb)
  small: "#7dacbb"            # info (#7dacbb)
  medium: "#7dacbb"           # info (#7dacbb)
  large: "#dfb86b"            # warning (#dfb86b)

inode:
  valid: "#67627d"            # placeholder (#67627d)
  invalid: "#f08692"          # error (#f08692)

links:
  valid: "#7dacbb"            # accent (#7dacbb)
  invalid: "#f08692"          # error (#f08692)

tree-edge: "#343949"          # border_variant (#343949)

git-status:
  default: "#a6a2bb"          # muted (#a6a2bb)
  unmodified: "#a6a2bb"       # muted (#a6a2bb)
  ignored: "#a6a2bb"          # muted (#a6a2bb)
  new-in-index: "#a4b78a"     # success (#a4b78a)
  new-in-workdir: "#a4b78a"   # success (#a4b78a)
  typechange: "#dfb86b"       # warning (#dfb86b)
  deleted: "#f08692"          # error (#f08692)
  renamed: "#7dacbb"          # accent (#7dacbb)
  modified: "#dfb86b"          # warning (#dfb86b)
  conflicted: "#f08692"        # error (#f08692)
