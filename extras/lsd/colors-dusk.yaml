# Flume colors for lsd.
# lsd color themes only style metadata; file names continue to use LS_COLORS.
# Numeric values are xterm-256 approximations supported by crossterm.

user: 145              # muted (#a6a2bb)
group: 145             # muted (#a6a2bb)

permission:
  read: 145             # quiet metadata (#a6a2bb)
  write: 179            # quiet metadata (#dfb86b)
  exec: 144             # quiet metadata (#a4b78a)
  exec-sticky: 210      # error (#f08692)
  no-access: 60        # placeholder (#67627d)
  octal: 145            # muted (#a6a2bb)
  acl: 109              # accent (#7dacbb)
  context: 247          # doc_comment (#9297a9)

date:
  hour-old: 145         # muted (#a6a2bb)
  day-old: 145          # muted (#a6a2bb)
