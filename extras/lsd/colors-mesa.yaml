# Flume colors for lsd.
# lsd color themes only style metadata; file names continue to use LS_COLORS.
# Numeric values are xterm-256 approximations supported by crossterm.

user: 59              # muted (#5f5964)
group: 59             # muted (#5f5964)

permission:
  read: 59             # quiet metadata (#5f5964)
  write: 59            # quiet metadata (#5f5964)
  exec: 59             # quiet metadata (#5f5964)
  exec-sticky: 95      # error (#89455f)
  no-access: 8        # placeholder (#817988)
  octal: 59            # muted (#5f5964)
  acl: 240              # accent (#2f6271)
  context: 241          # doc_comment (#626064)

date:
  hour-old: 59         # muted (#5f5964)
  day-old: 59          # muted (#5f5964)
  older: 8            # placeholder (#817988)

size:
  none: 8             # placeholder (#817988)
  small: 59            # muted (#5f5964)
  medium: 59           # muted (#5f5964)
  large: 94            # warning (#7d521e)

inode:
  valid: 59            # muted (#5f5964)
  invalid: 8          # placeholder (#817988)

links:
  valid: 59            # muted (#5f5964)
  invalid: 8          # placeholder (#817988)

tree-edge: 7          # border_variant (#c9bfbb)

git-status:
  default: 8          # placeholder (#817988)
  unmodified: 8       # placeholder (#817988)
  ignored: 8          # placeholder (#817988)
  new-in-index: 240     # success (#43615a)
  new-in-workdir: 240   # success (#43615a)
  typechange: 94       # warning (#7d521e)
  deleted: 95          # error (#89455f)
  renamed: 240          # accent (#2f6271)
  modified: 94         # warning (#7d521e)
  conflicted: 95       # error (#89455f)
