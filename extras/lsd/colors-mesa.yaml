# Flume colors for lsd.
# lsd color themes only style metadata; file names continue to use LS_COLORS.
# Quoted hex colors preserve the selected palette through lsd's crossterm parser.

user: "#524f50"              # syntax_primary (#524f50)
group: "#89455f"             # syntax_property (#89455f)

permission:
  read: "#5f5964"             # quiet metadata (#5f5964)
  write: "#5f5964"            # quiet metadata (#5f5964)
  exec: "#5f5964"             # quiet metadata (#5f5964)
  exec-sticky: "#89455f"      # error (#89455f)
  no-access: "#5f5964"        # muted (#5f5964)
  octal: "#5f5964"            # muted (#5f5964)
  acl: "#2f6271"              # accent (#2f6271)
  context: "#5e6069"          # doc_comment (#5e6069)

date:
  hour-old: "#5e6069"         # syntax_doc_comment (#5e6069)
  day-old: "#5e6069"          # syntax_doc_comment (#5e6069)
  older: "#5e6069"            # syntax_doc_comment (#5e6069)

size:
  none: "#306077"             # info (#306077)
  small: "#306077"            # info (#306077)
  medium: "#306077"           # info (#306077)
  large: "#7d521e"            # warning (#7d521e)

inode:
  valid: "#817988"            # placeholder (#817988)
  invalid: "#89455f"          # error (#89455f)

links:
  valid: "#2f6271"            # accent (#2f6271)
  invalid: "#89455f"          # error (#89455f)

tree-edge: "#c7bdc9"          # border_variant (#c7bdc9)

git-status:
  default: "#5f5964"          # muted (#5f5964)
  unmodified: "#5f5964"       # muted (#5f5964)
  ignored: "#5f5964"          # muted (#5f5964)
  new-in-index: "#43615a"     # success (#43615a)
  new-in-workdir: "#43615a"   # success (#43615a)
  typechange: "#7d521e"       # warning (#7d521e)
  deleted: "#89455f"          # error (#89455f)
  renamed: "#2f6271"          # accent (#2f6271)
  modified: "#7d521e"          # warning (#7d521e)
  conflicted: "#89455f"        # error (#89455f)
