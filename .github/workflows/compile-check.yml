name: Quality

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.9.5, stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run contract tests
        run: nvim --headless --clean -c "lua dofile('tests/run.lua')"

      - name: Verify generated extras
        if: matrix.neovim == 'stable'
        run: |
          if ! git diff --exit-code -- extras; then
            echo "::error::Generated files are out of date. Run :FlumeCompile and commit the result."
            exit 1
          fi
