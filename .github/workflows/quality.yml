name: Quality

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.9.5, stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        env:
          # The action renames extracted files into HOME, which may be on a different mount than /tmp.
          TMPDIR: ${{ runner.temp }}
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Setup StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: false

      - name: Run release quality gate
        run: ./scripts/check

  snapshots:
    name: Integration snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose cold snapshot provisioning
        run: |
          python3 -u - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          source = Path('tests/snapshots')
          recipe = (source / 'Dockerfile').read_text()
          marker = 'RUN python3 /tmp/build/install.py && rm -rf /tmp/build'
          assert recipe.count(marker) == 1
          wrapper = '''import runpy
          import shlex
          import subprocess
          import time

          original_run = subprocess.run
          def traced_run(command, **options):
              print('Starting: ' + shlex.join(command), flush=True)
              started = time.monotonic()
              try:
                  return original_run(command, **options, timeout=90)
              finally:
                  print(f'Elapsed: {time.monotonic() - started:.1f}s', flush=True)
          subprocess.run = traced_run
          runpy.run_path('/tmp/build/install.py', run_name='__main__')
          '''
          with tempfile.TemporaryDirectory() as temporary:
              context = Path(temporary)
              for name in ('tools.json', 'install.py'):
                  shutil.copyfile(source / name, context / name)
              (context / 'diagnose_install.py').write_text(wrapper)
              (context / 'Dockerfile').write_text(recipe.split(marker)[0] +
                  'COPY diagnose_install.py /tmp/build/\nRUN python3 -u /tmp/build/diagnose_install.py\n')
              subprocess.run(['docker', 'build', '--platform', 'linux/amd64', '--progress=plain',
                              '-t', 'flume-provisioning-diagnostic', str(context)], check=True, timeout=300)
          PY

      - name: Upload snapshot comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-snapshot-report
          path: ${{ runner.temp }}/flume-snapshot-report-*/
          if-no-files-found: ignore
          retention-days: 7
