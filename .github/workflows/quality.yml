name: Quality

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.9.5, stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run release quality gate
        run: ./scripts/check

  snapshots:
    name: Integration snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test exact integration snapshots
        run: ./scripts/snapshots test
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Upload snapshot comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-snapshot-report
          path: ${{ runner.temp }}/flume-snapshot-report-*/
          if-no-files-found: ignore
          retention-days: 7
